name: ci

# Runs every dbt model, every dbt test and the analysis notebooks on a small SYNTHETIC
# KKBox-shaped dataset (DuckDB). No cloud credentials, no real data, ~3 minutes.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: End-to-end pipeline on synthetic data
        run: python scripts/smoke_test.py
